<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232833"/>
      <stop offset="1" stop-color="#12151b"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4fb0ec"/>
      <stop offset="1" stop-color="#2580c3"/>
    </linearGradient>
  </defs>
  <rect x="48" y="48" width="928" height="928" rx="208" fill="url(#bg)"/>
  <!-- headband: orange inner arc over a dark outer arc, like the ZomBeatz mark -->
  <path d="M 214 600 A 298 298 0 0 1 810 600" fill="none" stroke="#0a0c10" stroke-width="64" stroke-linecap="round"/>
  <path d="M 214 600 A 298 298 0 0 1 810 600" fill="none" stroke="#ec6a3f" stroke-width="30" stroke-linecap="round"/>
  <!-- ear cups -->
  <rect x="196" y="500" width="84" height="264" rx="30" fill="#ec6a3f"/>
  <rect x="150" y="522" width="86" height="220" rx="30" fill="#0a0c10"/>
  <rect x="744" y="500" width="84" height="264" rx="30" fill="#ec6a3f"/>
  <rect x="788" y="522" width="86" height="220" rx="30" fill="#0a0c10"/>
  <!-- the nexus: mods linked to one hub; the orange one at the bottom is the one coming in -->
  <g stroke="#0a0c10" stroke-width="44" stroke-linecap="round">
    <path d="M512 590 L512 420 M512 590 L659 505 M512 590 L659 675 M512 590 L512 760 M512 590 L365 675 M512 590 L365 505"/>
  </g>
  <g stroke="url(#blue)" stroke-width="22" stroke-linecap="round">
    <path d="M512 590 L512 420 M512 590 L659 505 M512 590 L659 675 M512 590 L512 760 M512 590 L365 675 M512 590 L365 505"/>
  </g>
  <g stroke="#0a0c10" stroke-width="14">
    <circle cx="512" cy="590" r="72" fill="url(#blue)"/>
    <circle cx="512" cy="420" r="42" fill="url(#blue)"/>
    <circle cx="659" cy="505" r="42" fill="url(#blue)"/>
    <circle cx="659" cy="675" r="42" fill="url(#blue)"/>
    <circle cx="365" cy="675" r="42" fill="url(#blue)"/>
    <circle cx="365" cy="505" r="42" fill="url(#blue)"/>
    <circle cx="512" cy="760" r="42" fill="#ec6a3f"/>
  </g>
  <!-- highlights -->
  <circle cx="490" cy="566" r="16" fill="#ffffff" opacity=".85"/>
  <circle cx="500" cy="408" r="9" fill="#ffffff" opacity=".85"/>
</svg>
